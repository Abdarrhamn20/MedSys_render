    <!-- Toast Notification Styles -->
    <style>
        .toast-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast-message {
            padding: 14px 22px;
            border-radius: 10px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInToast 0.4s ease;
            max-width: 360px;
        }
        .toast-message.success { background: linear-gradient(135deg, #2DC653, #27ae60); }
        .toast-message.error { background: linear-gradient(135deg, #E63946, #c0392b); }
        .toast-message.info { background: linear-gradient(135deg, #0077B6, #00B4D8); }
        .toast-message.warning { background: linear-gradient(135deg, #FF9F1C, #e67e22); }
        .toast-message.fade-out { animation: fadeOutToast 0.3s ease forwards; }
        @keyframes slideInToast { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeOutToast { to { opacity: 0; transform: translateX(-30px); } }
    </style>
</head>
