services:
  - type: web
    name: medical-system
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:80
      - key: JWT_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: medical-pg
          property: connectionString

databases:
  - name: medical-pg
    databaseName: medical
    user: medical
    plan: free
    region: oregon
    ipAllowList: []
